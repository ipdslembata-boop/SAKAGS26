<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Anomali - BPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#dbeafe] text-slate-800 antialiased min-h-screen p-2 sm:p-4 flex flex-col items-center">

    <div class="w-full max-w-7xl bg-[#eff6ff] border-2 border-white rounded-2xl sm:rounded-3xl shadow-xl p-3 sm:p-6 flex flex-col gap-4">
        
        <!-- HEADER -->
        <header class="bg-[#bfdbfe] border-2 border-white rounded-2xl p-4 flex flex-col gap-3 shadow-sm">
            <div class="flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                    <span class="w-5 h-5 bg-blue-600 rounded-sm inline-block"></span>
                    <span class="text-[10px] sm:text-xs font-bold tracking-wider text-slate-700">SE2026</span>
                </div>
                <h1 class="text-base sm:text-xl font-bold text-slate-700 tracking-wide text-center">Monitoring Anomali</h1>
                <div id="lastUpdate" class="text-[9px] sm:text-[10px] bg-white/80 border border-slate-200 px-2 py-0.5 rounded-full text-slate-500">Update terakhir</div>
            </div>

            <!-- NAVIGASI -->
            <div class="flex flex-wrap justify-between items-center gap-2 pt-2 border-t border-white/60">
                <div class="flex items-center gap-1.5">
                    <a href="index.html" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-200 hover:bg-slate-300 text-slate-700 transition-colors">📊 Progres</a>
                    <a href="indexanomali.html" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-sm">⚠️ Anomali</a>
                </div>
                <nav class="flex gap-3 text-xs font-semibold text-blue-900">
                    <button data-category="Anomali Daerah" class="menu-item hover:underline cursor-pointer font-bold">Anomali Daerah</button>
                    <button data-category="Anomali Pusat" class="menu-item hover:underline cursor-pointer">Anomali Pusat</button>
                </nav>
            </div>
        </header>

        <!-- FILTER & RESUME -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="bg-[#bfdbfe] border-2 border-white rounded-2xl p-3 shadow-sm flex flex-col gap-2 md:col-span-2">
                <div class="text-xs font-bold text-slate-700">Filter Data</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <select id="filterKecamatan" onchange="applyFilters()" class="text-xs bg-white border border-slate-300 rounded-xl p-2 outline-none shadow-xs"><option value="">Semua Kecamatan</option></select>
                    <select id="filterDesa" onchange="applyFilters()" class="text-xs bg-white border border-slate-300 rounded-xl p-2 outline-none shadow-xs"><option value="">Semua Desa</option></select>
                </div>
                <input type="text" id="globalSearch" oninput="applyFilters()" placeholder="Cari data (Global Search)..." class="text-xs bg-white border border-slate-300 rounded-xl p-2 outline-none shadow-xs">
            </div>

            <div class="bg-[#bfdbfe] border-2 border-white rounded-2xl p-3 shadow-sm flex flex-col justify-between md:col-span-2">
                <div class="text-xs font-bold text-slate-700 text-center">Ringkasan Anomali</div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-white/80 p-2 rounded-xl border border-white">
                        <div class="text-[10px] font-semibold text-slate-600">Total</div>
                        <div id="kpiTotal" class="text-lg sm:text-xl font-bold text-blue-900">0</div>
                    </div>
                    <div class="bg-white/80 p-2 rounded-xl border border-white">
                        <div class="text-[10px] font-semibold text-slate-600">Selesai</div>
                        <div id="kpiResolved" class="text-lg sm:text-xl font-bold text-emerald-700">0</div>
                    </div>
                    <div class="bg-white/80 p-2 rounded-xl border border-white">
                        <div class="text-[10px] font-semibold text-slate-600">Sisa</div>
                        <div id="kpiOpen" class="text-lg sm:text-xl font-bold text-amber-700">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- UTAMA -->
        <main class="w-full">
            <div class="bg-gradient-to-br from-[#d1fae5] via-[#a7f3d0] to-[#bfdbfe] border-2 border-white rounded-2xl sm:rounded-3xl p-3 sm:p-5 shadow-sm flex flex-col gap-4">
                
                <div class="bg-white/90 border border-white rounded-2xl shadow-xs overflow-hidden flex flex-col">
                    <div class="bg-[#93c5fd] text-white text-xs font-bold py-2.5 px-4 flex flex-wrap justify-between items-center gap-2 tracking-wider">
                        <span>Tabel Anomali & Tindak Lanjut</span>
                        <div id="sheetTabs" class="flex flex-wrap gap-1.5"></div>
                    </div>

                    <!-- PENJELASAN ANOMALI -->
                    <div class="p-3 bg-slate-50/80 border-b border-slate-200">
                        <div class="text-[11px] font-bold text-slate-700 mb-1">Informasi Anomali & Solusi:</div>
                        <div id="anomalyExplanation" class="text-[11px] text-slate-600 bg-white p-2.5 rounded-xl border border-slate-200">
                            Memuat penjelasan anomali...
                        </div>
                    </div>

                    <div class="p-3 flex justify-between items-center">
                        <div id="syncStatus" class="text-[11px] text-slate-500 italic">Ketik di kolom TINDAK_LANJUT untuk menyimpan otomatis.</div>
                        <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-medium px-3 py-1.5 rounded-lg transition-colors shadow-xs">Unduh Laporan (CSV)</button>
                    </div>

                    <div class="overflow-x-auto max-h-[500px]">
                        <table class="w-full text-left text-xs text-slate-700">
                            <thead id="tableHeader" class="bg-slate-100 text-slate-700 font-semibold border-b border-slate-200 sticky top-0 z-10"></thead>
                            <tbody id="tableBody" class="divide-y divide-slate-200"></tbody>
                        </table>
                    </div>

                    <div id="pagination" class="p-3 flex justify-center gap-2 text-xs bg-white border-t border-slate-200"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkAIAut278sC2SSAlrF4_soZOdfKchQTqpPMeVuDtkdZM3jmwUjlSQpLj-FjjkSuFN/exec";

        const CONFIG = {
            'Anomali Daerah': {
                'SAK1': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHgs6W7kqvf8CZU0w_AxOkWRzdLHChWiAkC1l7MB6L1HR0zrQUJh3itfiT9JTclNZwp0dqYiNnItUS/pub?output=csv',
                'SAK2': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHgs6W7kqvf8CZU0w_AxOkWRzdLHChWiAkC1l7MB6L1HR0zrQUJh3itfiT9JTclNZwp0dqYiNnItUS/pub?gid=2104208790&output=csv'
            },
            'Anomali Pusat': {}
        };

        let currentActiveData = [], filteredData = [], currentPage = 1, rowsPerPage = 50;
        let currentCategory = 'Anomali Daerah';
        let currentSheetName = '';
        let anomalyExplanationsData = {};

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                currentCategory = e.target.dataset.category;
                document.querySelectorAll('.menu-item').forEach(btn => btn.style.fontWeight = 'normal');
                e.target.style.fontWeight = 'bold';
                initCategory(currentCategory);
            });
        });

        async function initCategory(cat) {
            currentCategory = cat;
            const explanationBox = document.getElementById('anomalyExplanation');

            if (Object.keys(anomalyExplanationsData).length === 0) {
                try {
                    const response = await fetch('anomali-info.json');
                    anomalyExplanationsData = await response.json();
                } catch (e) {
                    console.error("Gagal memuat file JSON penjelasan:", e);
                }
            }

            const sheets = CONFIG[cat];
            const sheetKeys = Object.keys(sheets);
            const tabsContainer = document.getElementById('sheetTabs');
            tabsContainer.innerHTML = '';

            if (sheetKeys.length === 0 || !sheets[sheetKeys[0]]) {
                document.getElementById('tableBody').innerHTML = `<tr><td class="p-4 text-center text-slate-400">Belum ada URL sheet untuk kategori ini.</td></tr>`;
                explanationBox.innerHTML = '<span class="text-slate-400">Tidak ada penjelasan tersedia untuk kategori ini.</span>';
                return;
            }

            sheetKeys.forEach((sheetName, index) => {
                const btn = document.createElement('button');
                btn.textContent = sheetName;
                btn.className = `px-2.5 py-1 rounded text-[11px] transition-colors cursor-pointer ${index === 0 ? 'bg-blue-700 text-white' : 'bg-blue-500/50 hover:bg-blue-600 text-white'}`;
                
                btn.onclick = () => {
                    document.querySelectorAll('#sheetTabs button').forEach(b => b.className = 'px-2.5 py-1 rounded text-[11px] transition-colors cursor-pointer bg-blue-500/50 hover:bg-blue-600 text-white');
                    btn.className = 'px-2.5 py-1 rounded text-[11px] transition-colors cursor-pointer bg-blue-700 text-white';
                    
                    renderExplanation(currentCategory, sheetName);
                    loadSheetData(sheets[sheetName], sheetName);
                };
                tabsContainer.appendChild(btn);
            });

            renderExplanation(cat, sheetKeys[0]);
            loadSheetData(sheets[sheetKeys[0]], sheetKeys[0]);
        }

        function renderExplanation(cat, sheetName) {
            const explanationBox = document.getElementById('anomalyExplanation');
            const info = anomalyExplanationsData[cat]?.[sheetName];

            if (!info) {
                explanationBox.innerHTML = `<span class="text-slate-400">Penjelasan untuk <b>${sheetName}</b> belum ditambahkan di file JSON.</span>`;
                return;
            }

            let badgeColor = 'bg-blue-100 text-blue-800';
            if (info.tingkat_keparahan === 'kritis') badgeColor = 'bg-red-100 text-red-800';
            else if (info.tingkat_keparahan === 'sedang') badgeColor = 'bg-amber-100 text-amber-800';
            else if (info.tingkat_keparahan === 'rendah') badgeColor = 'bg-emerald-100 text-emerald-800';

            explanationBox.innerHTML = `
                <div class="flex flex-col gap-1">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-700">${sheetName}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase ${badgeColor}">${info.tingkat_keparahan}</span>
                    </div>
                    <div><span class="font-semibold text-slate-700">Detail:</span> ${info.penjelasan_detail}</div>
                    <div><span class="font-semibold text-slate-700">Solusi:</span> ${info.solusi_perbaikan}</div>
                </div>
            `;
        }

        async function loadSheetData(url, sheetName) {
            currentSheetName = sheetName;
            try {
                document.getElementById('tableBody').innerHTML = `<tr><td class="p-4 text-center text-slate-500">Memuat data sheet ${sheetName}...</td></tr>`;
                const res = await fetch(url);
                const text = await res.text();
                currentActiveData = parseCSV(text);
                filteredData = [...currentActiveData];
                currentPage = 1;
                renderAll();
                document.getElementById('lastUpdate').innerText = 'Update: ' + new Date().toLocaleTimeString('id-ID');
            } catch (err) {
                console.error("Gagal memuat:", err);
                document.getElementById('tableBody').innerHTML = `<tr><td class="p-4 text-center text-red-500">Gagal memuat data sheet ${sheetName}.</td></tr>`;
            }
        }

        function parseCSV(text) {
            let lines = text.split("\n").filter(l => l.trim() !== "");
            if (lines.length === 0) return [];
            let headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
            return lines.slice(1).map((line, index) => {
                let row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let obj = { _rowIndex: index + 2 };
                headers.forEach((h, i) => obj[h] = (row[i] || "").replace(/^"|"$/g, ''));
                return obj;
            });
        }

        function applyFilters() {
            const kec = document.getElementById('filterKecamatan').value;
            const desa = document.getElementById('filterDesa').value;
            const search = document.getElementById('globalSearch').value.toLowerCase();
            
            filteredData = currentActiveData.filter(row => {
                const rowKec = String(row.KEC || row.KECAMATAN || row.kecamatan || '');
                const rowDesa = String(row.DESA || row.desa || '');
                if (kec && rowKec !== kec) return false;
                if (desa && rowDesa !== desa) return false;
                if (search && !Object.values(row).some(v => String(v).toLowerCase().includes(search))) return false;
                return true;
            });
            currentPage = 1;
            renderAll();
        }

        function renderAll() {
            renderKPI(filteredData);
            populateFilters(currentActiveData);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage - 1) * rowsPerPage;
            const pageData = filteredData.slice(start, start + rowsPerPage);
            
            if (filteredData.length === 0) {
                document.getElementById('tableHeader').innerHTML = '';
                tbody.innerHTML = `<tr><td class="p-4 text-center text-slate-400">Tidak ada data ditemukan.</td></tr>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const keys = Object.keys(filteredData[0]).filter(k => k !== '_rowIndex');
            
            document.getElementById('tableHeader').innerHTML = `<tr>${keys.map(k => `<th class="p-3 uppercase text-[11px] whitespace-nowrap">${k.replace(/_/g, ' ')}</th>`).join('')}</tr>`;
            
            tbody.innerHTML = pageData.map(row => {
                return `<tr class="hover:bg-slate-50 transition-colors">
                    ${keys.map(k => {
                        let cellValue = row[k] || '';
                        
                        if (k === 'TINDAK_LANJUT') {
                            return `<td class="p-2 whitespace-nowrap">
                                <input type="text" value="${cellValue}" 
                                    onchange="saveTindakLanjut(${row._rowIndex}, this.value)" 
                                    placeholder="Ketik tindak lanjut..." 
                                    class="w-44 text-[11px] bg-white border border-slate-300 rounded-lg p-1.5 outline-none focus:border-blue-500 shadow-xs">
                            </td>`;
                        }

                        if (k.toUpperCase() === 'LINK') {
                            return `<td class="p-3 text-[11px] whitespace-nowrap">
                                <a href="${cellValue}" target="_blank" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-lg text-[10px] shadow-sm transition-colors text-center">Buka Link</a>
                            </td>`;
                        }
                        return `<td class="p-3 text-[11px] whitespace-nowrap">${cellValue}</td>`;
                    }).join('')}
                </tr>`;
            }).join('');
            
            const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
            document.getElementById('pagination').innerHTML = `
                <button onclick="changePage(-1)" class="px-3 py-1 bg-white border rounded shadow-xs cursor-pointer">Prev</button>
                <span class="px-3 py-1">Hal ${currentPage} / ${totalPages}</span>
                <button onclick="changePage(1)" class="px-3 py-1 bg-white border rounded shadow-xs cursor-pointer">Next</button>
            `;
        }

        async function saveTindakLanjut(rowIndex, value) {
            const statusEl = document.getElementById('syncStatus');
            statusEl.textContent = "Menyimpan perubahan ke Google Sheets...";
            statusEl.className = "text-[11px] text-amber-600 font-semibold italic";

            try {
                const formData = new URLSearchParams();
                formData.append('sheet', currentSheetName);
                formData.append('row', rowIndex);
                formData.append('value', value);

                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.result === 'success') {
                    statusEl.textContent = "Perubahan berhasil tersimpan!";
                    statusEl.className = "text-[11px] text-emerald-600 font-semibold italic";
                    const target = currentActiveData.find(d => d._rowIndex === rowIndex);
                    if (target) target.TINDAK_LANJUT = value;
                    renderKPI(filteredData);
                } else {
                    throw new Error(result.message || 'Gagal menyimpan');
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Gagal menyimpan! Periksa koneksi atau URL Apps Script.";
                statusEl.className = "text-[11px] text-red-600 font-semibold italic";
            }
        }

        function changePage(dir) {
            const maxPage = Math.ceil(filteredData.length / rowsPerPage);
            currentPage = Math.max(1, Math.min(currentPage + dir, maxPage));
            renderTable();
        }

        function renderKPI(data) {
            const resolved = data.filter(d => d.TINDAK_LANJUT && d.TINDAK_LANJUT.trim() !== "").length;
            document.getElementById('kpiTotal').textContent = data.length;
            document.getElementById('kpiResolved').textContent = resolved;
            document.getElementById('kpiOpen').textContent = data.length - resolved;
        }

        function populateFilters(data) {
            if (!data || data.length === 0) return;
            const kecs = [...new Set(data.map(d => d.KEC || d.KECAMATAN || d.kecamatan))].filter(Boolean);
            const desas = [...new Set(data.map(d => d.DESA || d.desa))].filter(Boolean);
            fillSelect('filterKecamatan', kecs, 'Semua Kecamatan');
            fillSelect('filterDesa', desas, 'Semua Desa');
        }

        function fillSelect(id, items, label) {
            const el = document.getElementById(id);
            const current = el.value;
            el.innerHTML = `<option value="">${label}</option>`;
            items.forEach(i => el.innerHTML += `<option value="${i}">${i}</option>`);
            el.value = current;
        }

        function exportToCSV() {
            if (!filteredData.length) return alert('Tidak ada data');
            const keys = Object.keys(filteredData[0]).filter(k => k !== '_rowIndex');
            let csv = keys.join(',') + '\n';
            filteredData.forEach(d => {
                csv += keys.map(k => `"${d[k] !== undefined ? d[k] : ''}"`).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `laporan_${currentSheetName.toLowerCase()}.csv`;
            a.click();
        }

        initCategory('Anomali Daerah');
    </script>
</body>
</html>
